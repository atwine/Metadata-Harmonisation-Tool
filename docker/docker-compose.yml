version: '3.8'

services:
  metadata-harmonisation-tool:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: metadata-harmonisation-tool:latest
    container_name: metadata-harmonisation-tool
    ports:
      - "8501:8501"
    environment:
      # Streamlit configuration
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLE_CORS=false
      - STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION=false
      - STREAMLIT_SERVER_FILE_WATCHER_TYPE=none
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - STREAMLIT_GLOBAL_DEVELOPMENT_MODE=false
      - STREAMLIT_GLOBAL_SUPPRESS_WARNING=true
      - STREAMLIT_LOG_LEVEL=warning
      
      # AI Provider configurations (override with .env file)
      - OLLAMA_HOST=ollama
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      
      # Application settings
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    env_file:
      - ../.env
    volumes:
      # Mount input/results/logs directories for data persistence
      - ../input:/app/input
      - ../results:/app/results
      - ../logs:/app/logs

    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - metadata-network

  # Optional: Ollama service for local AI processing
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-server
    ports:
      # Default to 11435 on the host to avoid conflicts with a locally running Ollama (which commonly uses 11434).
      - "${OLLAMA_PUBLISHED_PORT:-11435}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      # Bind to all interfaces so other containers can reach the server.
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      # Use `ollama ls` to list models. [src: https://docs.ollama.com/cli]
      test: ["CMD", "ollama", "ls"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - metadata-network

  # One-shot bootstrap container to pre-download models on first run.
  # Uses Ollama HTTP API to pull models. [src: https://docs.ollama.com/api/pull]
  ollama-init:
    image: curlimages/curl:8.12.1
    container_name: ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      set -e;
      echo 'Waiting for Ollama...';
      until curl -sf http://ollama:11434/api/tags >/dev/null; do sleep 2; done;
      echo 'Pulling starter models...';
      curl -sf http://ollama:11434/api/pull -d '{"model": "llama3.1:8b"}' >/dev/null;
      curl -sf http://ollama:11434/api/pull -d '{"model": "nomic-embed-text"}' >/dev/null;
      echo 'Model bootstrap complete.';
    restart: "no"
    networks:
      - metadata-network

volumes:
  ollama_data:
    driver: local

networks:
  metadata-network:
    driver: bridge
