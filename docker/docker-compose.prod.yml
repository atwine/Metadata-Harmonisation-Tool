version: '3.8'

# Production-specific Docker Compose configuration
# Usage: docker-compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up

services:
  metadata-harmonisation-tool:
    image: metadata-harmonisation-tool:latest
    
    # Production environment variables
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLE_CORS=false
      - STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION=true
      - STREAMLIT_SERVER_FILE_WATCHER_TYPE=none
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - STREAMLIT_GLOBAL_DEVELOPMENT_MODE=false
      
      # Production logging
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      
    # Production volume mounts (read-only where possible)
    volumes:
      # NOTE: input/ must be writable because the app can create new studies under input/. [src: app/components/upload_study.py]
      - ../input:/app/input
      - ../results:/app/results
      - ../logs:/app/logs
      
      # Remove development code mounts for security
      # - ../app:/app/app  # REMOVED for production
      # - ../config.py:/app/config.py  # REMOVED for production
      
    # Production restart policy
    restart: always
    
    # Production resource limits
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    
    # Production health check (more frequent)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    # Production-specific labels
    labels:
      - "prod.environment=production"
      - "prod.service=metadata-harmonisation-tool"
      - "prod.version=1.0.0"

  # Production reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: metadata-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - metadata-harmonisation-tool
    restart: always
    networks:
      - metadata-network
    profiles:
      - nginx  # Use with: docker-compose --profile nginx up

  # Production monitoring (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: metadata-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - metadata-network
    profiles:
      - monitoring  # Use with: docker-compose --profile monitoring up

volumes:
  prometheus_data:
    driver: local
